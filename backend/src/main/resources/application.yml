server:
  port: 8080

spring:
  application:
    name: ai-followup-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/ai_followup;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  max-visible-sheets: 8
  max-rows: 5000
  sender:
    mode: manual

logging:
  level:
    com.xiaocui.followup: INFO
