# 切换到 MySQL：启动参数加 --spring.profiles.active=mysql
# 并按需提供连接信息，例如：
#   java -jar app.jar --spring.profiles.active=mysql ^
#        --DB_URL=jdbc:mysql://localhost:3306/ai_followup?useUnicode=true^&characterEncoding=utf8^&serverTimezone=Asia/Shanghai ^
#        --DB_USER=root --DB_PASSWORD=你的密码 --DB_DRIVER=com.mysql.cj.jdbc.Driver
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_followup?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
